<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>nCatossi Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1f2937;
      background: #f3f4f6;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .section {
      background: white;
      margin: 8px 8px 0;
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .row { display: flex; align-items: center; gap: 8px; }

    select {
      flex: 1;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      background: white;
      cursor: pointer;
    }
    select:focus { border-color: #4f46e5; }

    .icon-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .icon-btn:hover { background: #f9fafb; }
    .icon-btn.danger:hover { background: #fef2f2; border-color: #fca5a5; }

    textarea {
      width: 100%;
      min-height: 90px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      resize: vertical;
      outline: none;
      margin-top: 8px;
      color: #374151;
      line-height: 1.5;
    }
    textarea:focus { border-color: #4f46e5; }

    .url-count {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 5px;
    }

    .rate-value {
      font-size: 30px;
      font-weight: 800;
      color: #4f46e5;
      text-align: center;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .toggle {
      position: relative;
      width: 38px;
      height: 21px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #d1d5db;
      border-radius: 21px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .toggle-thumb {
      position: absolute;
      width: 15px;
      height: 15px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
      pointer-events: none;
    }
    .toggle input:checked ~ .toggle-track { background: #4f46e5; }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(17px); }

    .toggle-label { font-weight: 500; color: #374151; }

    .auto-fields {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .auto-fields.active { display: flex; }

    .inline-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #374151;
      flex-wrap: wrap;
    }

    input[type="number"] {
      width: 56px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 13px;
      outline: none;
      text-align: center;
    }
    input[type="number"]:focus { border-color: #4f46e5; }

    .current-rate-row {
      display: none;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      margin-top: 2px;
      border-top: 1px solid #f3f4f6;
    }
    .current-rate-row.active { display: flex; }

    .current-rate-label { font-size: 12px; color: #6b7280; }

    .badge {
      background: #eef2ff;
      color: #4f46e5;
      font-weight: 700;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 20px;
    }

    .reset-btn {
      margin-left: auto;
      font-size: 11px;
      color: #6b7280;
      background: none;
      border: 1px solid #e5e7eb;
      border-radius: 5px;
      padding: 3px 9px;
      cursor: pointer;
    }
    .reset-btn:hover { background: #f9fafb; color: #374151; }

    .save-btn {
      display: block;
      width: calc(100% - 16px);
      margin: 8px 8px 10px;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.2px;
    }
    .save-btn:hover { background: #4338ca; }
    .save-btn.success { background: #10b981; }
  </style>
</head>
<body>

  <header>nCatossi</header>

  <!-- Library -->
  <div class="section">
    <div class="section-title">Image Library</div>
    <div class="row">
      <select id="library-select"></select>
      <button class="icon-btn" id="add-library" title="New library">+</button>
      <button class="icon-btn danger" id="delete-library" title="Delete library">🗑</button>
    </div>
    <textarea id="url-textarea"
      placeholder="Paste image URLs here, one per line&#10;&#10;https://example.com/photo1.jpg&#10;https://example.com/photo2.jpg"></textarea>
    <div class="url-count" id="url-count">0 images</div>
  </div>

  <!-- Replacement Rate -->
  <div class="section">
    <div class="section-title">Replacement Rate</div>
    <div class="rate-value" id="rate-display">100%</div>
    <input type="range" id="rate-slider" min="0" max="100" step="1" value="1">
  </div>

  <!-- Auto-Increase -->
  <div class="section">
    <div class="section-title">Auto-Increase</div>
    <div class="toggle-row">
      <label class="toggle">
        <input type="checkbox" id="auto-increase-toggle">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <span class="toggle-label">Enable auto-increase</span>
    </div>
    <div class="auto-fields" id="auto-increase-fields">
      <div class="inline-row">
        <span>Increase by</span>
        <input type="number" id="increase-amount" min="1" max="100" value="10">
        <span>% every</span>
        <input type="number" id="increase-count" min="1" value="1">
        <select id="increase-interval" style="flex:unset; width:auto;">
          <option value="minute">minute(s)</option>
          <option value="hour" selected>hour(s)</option>
          <option value="day">day(s)</option>
        </select>
      </div>
    </div>
    <div class="current-rate-row" id="current-rate-row">
      <span class="current-rate-label">Current rate:</span>
      <span class="badge" id="current-rate-display">100%</span>
      <button class="reset-btn" id="reset-rate">Reset to base</button>
    </div>
  </div>

  <button class="save-btn" id="save-btn">Save Settings</button>

  <script src="popup.js"></script>
</body>
</html>
